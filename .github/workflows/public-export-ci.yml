name: Public Export Candidate CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify-approved-public-bytes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR merge tree without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify out-of-band owner-approved v2 bytes
        run: python3 scripts/check-public-export.py
